name: Vulnerabilities

# Not on every push: a vulnerability database update would turn pushes red
# that have nothing to do with it. scripts/release.sh also scans at release.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop path:./.nix -c scripts/vuln.sh
